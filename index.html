<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Across Bridge</title><style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#f5f6f8;color:#20242a;margin:0}main{max-width:480px;margin:8vh auto;padding:24px}h1{font-size:26px}p{line-height:1.6;color:#626873}textarea{box-sizing:border-box;width:100%;min-height:180px;padding:16px;border:1px solid #ddd;border-radius:12px;font:inherit;background:white}a{display:block;text-align:center;padding:16px;background:#235ecb;color:white;text-decoration:none;border-radius:12px;margin-top:16px}a[aria-disabled=true]{opacity:.5;pointer-events:none}small{display:block;margin-top:16px;color:#626873}</style></head><body><main><h1>AI Across Bridge</h1><p>등록할 할 일을 확인하세요. 한 줄마다 할 일 하나가 생성됩니다.</p><textarea id="tasks" placeholder="컴퓨터 정리하기&#10;핸드폰 정리하기"></textarea><a id="run" aria-disabled="true">Across에 할 일 등록</a><small>아이폰에서 실행하세요. 단축어 열기 요청이 나타나면 허용하세요. 등록 완료 여부는 Across에서 확인하세요.</small></main><script>const tasks=document.getElementById('tasks'),run=document.getElementById('run');const params=new URLSearchParams(location.hash.slice(1));tasks.value=params.get('tasks')||'';function update(){const value=tasks.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).join('\n');run.setAttribute('aria-disabled',String(!value));if(value)run.href='shortcuts://run-shortcut?name='+encodeURIComponent('Ai 할일등록')+'&input=text&text='+encodeURIComponent(value);else run.removeAttribute('href')}tasks.addEventListener('input',update);update();</script></body></html>
